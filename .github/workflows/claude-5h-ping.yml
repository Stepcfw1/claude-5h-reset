name: Claude 5h ping

# Sends one tiny message to Claude right after the 5-hour usage window resets,
# so the next window starts immediately. Cron times are UTC.
# Modes: Actions > Claude 5h ping > Run workflow. See README.md.
on:
  schedule:
    - cron: '3-59/10 * * * *' # check: every 10 minutes, pings only when one is due
    - cron: '27 4 * * 1'      # keepalive: weekly, stops GitHub auto-disabling the schedule
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = reset soon after your start time · auto = every 5h, clears a plan · ping-now = one ping now'
        type: choice
        options:
          - plan
          - auto
          - ping-now
        default: plan
      start:
        description: 'plan: when you start, Eastern (DC) time (9am, 18:30, tomorrow 9am, sat 10am, 2026-09-20 14:00)'
        type: string
        required: false
      reset_after:
        description: 'plan: minutes after you start that the window should reset'
        type: number
        default: 60

permissions: {}

env:
  TIMEZONE: America/New_York
  WINDOW_SECONDS: 18000 # 5 hours
  MARGIN_SECONDS: 60    # ping this long after a reset, never before it
  LEAD_SECONDS: 1500    # start waiting when a ping is less than 25 min away

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'ping-now'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Save plan
        env:
          MODE: ${{ inputs.mode }}
          START: ${{ inputs.start }}
          RESET_AFTER: ${{ inputs.reset_after }}
          PLAN_ID: ${{ github.run_id }}
        run: bash scripts/plan.sh

      - uses: actions/cache/save@v4
        with:
          path: plan
          key: plan-${{ github.run_id }}-${{ github.run_attempt }}

  ping:
    needs: plan
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '3-59/10 * * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: claude-5h-ping
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Load last known reset time
        uses: actions/cache/restore@v4
        with:
          path: state
          key: next-reset-${{ github.run_id }}
          restore-keys: next-reset-

      - name: Load planned start
        uses: actions/cache/restore@v4
        with:
          path: plan
          key: plan-${{ github.run_id }}
          restore-keys: plan-

      - name: Decide when to ping
        id: check
        env:
          FORCE: ${{ inputs.mode == 'ping-now' }}
        run: bash scripts/decide.sh

      - uses: actions/setup-node@v4
        if: steps.check.outputs.due == 'true'
        with:
          node-version: 22

      - name: Install Claude Code
        if: steps.check.outputs.due == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Wait until ping time
        if: steps.check.outputs.due == 'true' && steps.check.outputs.wait != '0'
        run: sleep ${{ steps.check.outputs.wait }}

      - name: Send ping and read the next reset time
        if: steps.check.outputs.due == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CONSUME: ${{ steps.check.outputs.consume }}
        run: bash scripts/ping.sh

      - name: Save next reset time
        if: steps.check.outputs.due == 'true'
        uses: actions/cache/save@v4
        with:
          path: state
          key: next-reset-${{ github.run_id }}-${{ github.run_attempt }}

  keepalive:
    if: github.event.schedule == '27 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Re-enable workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/claude-5h-ping.yml/enable"
